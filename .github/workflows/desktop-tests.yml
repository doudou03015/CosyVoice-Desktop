name: Desktop tests
on:
  push:
    paths: ['desktop_app/**', 'tests_desktop/**', 'cosyvoice/**', 'packaging/**', 'voice_library/**', 'requirements-*.txt', '.github/workflows/desktop-tests.yml']
  pull_request:
    paths: ['desktop_app/**', 'tests_desktop/**', 'cosyvoice/**', 'packaging/**', 'voice_library/**', 'requirements-*.txt', '.github/workflows/desktop-tests.yml']
  workflow_dispatch:
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-gui-build.txt
      - run: python -m pytest tests_desktop -q
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: '1'
